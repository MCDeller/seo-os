# Portal definition: AUTONOMY
# Read by scripts/portal/setup-portal.sh. Bash syntax. No secrets in here —
# API keys go in <PORTAL_HOME>/config/portal.env after setup.

PORTAL_NAME="autonomy"
PORTAL_TITLE="AUTONOMY"
PORT=3101

# Portable home on the Windows D: drive (as seen from Ubuntu/WSL).
PORTAL_HOME="/mnt/d/AI-Tools/AIOS-Vault/SEO-Office"

# Engine (code, node_modules, index.db, gcloud sign-in) stays on the fast
# Linux filesystem inside Ubuntu.
ENGINE_DIR="$HOME/seo-engines/autonomy"

# Google account that owns this portal's Search Console / GA4 access.
GOOGLE_ACCOUNT="manager@richardgrove.info"

# Brain frontmatter `owner` for new client vaults.
OWNER="AUTONOMY"

# One line per client: "slug|Display name|https://site-url"
CLIENTS=(
  "autonomy|AUTONOMY|https://richardgrove.org"
  "grand-theft-world|Grand Theft World|https://grandtheftworld.com"
  "tragedy-and-hope|Tragedy and Hope|https://tragedyandhope.com"
)
